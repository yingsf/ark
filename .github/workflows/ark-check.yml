name: ark-check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Validate plugin JSON
        run: |
          python -m json.tool .claude-plugin/plugin.json
          python -m json.tool .claude-plugin/marketplace.json
      - name: Run ARK repository checks
        run: python scripts/ark-check.py
      - name: List release checks
        run: python scripts/ark-release-check.py --list
      - name: Run ARK smoke checks
        run: python scripts/ark-smoke.py
      - name: Run ARK skill smoke
        run: python scripts/ark-skill-smoke.py
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Run ARK checks with uv
        run: |
          uv run python scripts/ark-check.py
          uv run python scripts/ark-release-check.py --list
          uv run python scripts/ark-smoke.py --require-uv
          uv run python scripts/ark-skill-smoke.py
          uv run python -m unittest discover -s tests
      - name: Validate Claude plugin if CLI is available
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate .
          else
            echo "Claude Code CLI not available; skipping plugin validate."
          fi
